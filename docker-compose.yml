services:

  postgres:
    image: postgres:16

    container_name: lms-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lms_db

    ports:
      - "5432:5432"

    volumes:
      - lms_postgres_data:/var/lib/postgresql/data

volumes:
  lms_postgres_data: